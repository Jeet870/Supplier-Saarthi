<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield / Ledger Outline -->
  <g filter="url(#shadow)">
    <!-- Shield / Ledger Base -->
    <path d="M256 70 L390 125 C390 270, 310 380, 256 425 C202 380, 122 270, 122 125 Z" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Checklist / Balance Lines -->
    <rect x="180" y="165" width="152" height="18" rx="9" fill="#ffffff" />
    <rect x="180" y="205" width="110" height="18" rx="9" fill="#ffffff" fill-opacity="0.8" />
    <rect x="180" y="245" width="130" height="18" rx="9" fill="#ffffff" fill-opacity="0.8" />

    <!-- Mic Symbol in Center-Bottom -->
    <g transform="translate(256, 315)">
      <!-- Mic Capsule -->
      <rect x="-20" y="-35" width="40" height="65" rx="20" fill="#facc15" stroke="#ffffff" stroke-width="6"/>
      <!-- Mic Arc -->
      <path d="M-36 0 C-36 28, 36 28, 36 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <!-- Mic Stand -->
      <line x1="0" y1="28" x2="0" y2="48" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <line x1="-24" y1="48" x2="24" y2="48" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
