<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}Supplier Saarthi | Kirana Voice Assistant{% endblock %}</title>
  
  <!-- PWA & Mobile Meta Tags (Task 5C-1) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Supplier Saarthi">
  <link rel="apple-touch-icon" href="/static/img/icon-192.png">
  
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/img/icon.svg">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <!-- Professional SaaS Header -->
    <header class="header-bar">
      <a href="/" class="brand-group">
        <div class="brand-badge-icon">🤝</div>
        <div class="brand-text-col">
          <div class="brand-heading">
            Supplier Saarthi
            <span class="brand-badge-pill">AI</span>
          </div>
          <div class="brand-subtext">Bolo, confirm karo, yaad rakho</div>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="desktop-nav">
        <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">Dashboard</a>
        <a href="/delivery" class="nav-link {% if active_page == 'delivery' %}active{% endif %}">Delivery Check</a>
        <a href="/promise" class="nav-link {% if active_page == 'promise' %}active{% endif %}">Promise Note</a>
        <a href="/pending" class="nav-link {% if active_page == 'pending' %}active{% endif %}">Pending</a>
        <a href="/suppliers" class="nav-link {% if active_page == 'suppliers' %}active{% endif %}">Suppliers</a>
      </nav>

      <!-- Live Connection Pill -->
      <div class="connection-status-pill" id="global-status-pill">
        <span class="status-dot-pulse"></span>
        <span id="global-status-text">Online</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-area">
      {% block content %}{% endblock %}
    </main>

    <!-- Mobile Sticky Bottom Navigation (< 680px) -->
    <nav class="mobile-nav-bar">
      <a href="/" class="mobile-tab-item {% if active_page == 'home' %}active{% endif %}">
        <span class="mobile-tab-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="/delivery" class="mobile-tab-item {% if active_page == 'delivery' %}active{% endif %}">
        <span class="mobile-tab-icon">🚚</span>
        <span>Delivery</span>
      </a>
      <a href="/promise" class="mobile-tab-item {% if active_page == 'promise' %}active{% endif %}">
        <span class="mobile-tab-icon">🤝</span>
        <span>Promise</span>
      </a>
      <a href="/pending" class="mobile-tab-item {% if active_page == 'pending' %}active{% endif %}">
        <span class="mobile-tab-icon">⏳</span>
        <span>Pending</span>
      </a>
      <a href="/suppliers" class="mobile-tab-item {% if active_page == 'suppliers' %}active{% endif %}">
        <span class="mobile-tab-icon">🏪</span>
        <span>Suppliers</span>
      </a>
    </nav>
  </div>
  
  <!-- Client JavaScript Application Bundle -->
  <script src="/static/app.js"></script>
  <script>
    // Register Service Worker for offline operation & Add to Home Screen (Task 5C-1)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(function (reg) {
            console.log('[PWA] Service Worker registered:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
